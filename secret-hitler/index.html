<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is load-bearing: every screen pads itself with
         env(safe-area-inset-*), which reports 0 without it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Secret Hitler XL</title>
    <meta name="description" content="Local pass-and-play Secret Hitler with the Communist (XL) expansion. Works offline." />

    <!-- Colours the mobile status bar and the install splash. -->
    <meta name="theme-color" content="#7f1d1d" />

    <!-- iOS ignores the manifest for "Add to Home Screen"; these are what it reads. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Secret Hitler" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#7f1d1d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
